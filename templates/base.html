<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Календарь тренировок{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">


    {% if current_user.is_authenticated %}
    <header class="top-bar">
        <p>Вы вошли как {{ current_user.username }}. Вы {% if current_user.role=='trainer' %}тренер
            {% else %}клиент{% endif %}</p>
        <form method="post" action="{{ url_for('logout') }}">
            <button>Выйти</button>
        </form>

    </header>
    {% endif %}


    {% block content %}
    {% endblock %}
</div>
</body>
</html>
