{% extends "base.html" %}
 
{% block content %}
<h1>Вход</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
  <input name="username" placeholder="Логин">
  <input name="password" type="password"
    placeholder="Пароль">
  <button>Войти</button>
</form>
<a href="{{ url_for('register') }}">Регистрация</a>
{% endblock %}
